name: Deploy to production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 91.99.170.150
          username: wharf
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            commit="${{ github.sha }}"
            cd /home/wharf/wharf-frontend
            git fetch origin main
            git show "$commit:scripts/deploy-clean-release.sh" > /home/wharf/deploy-clean-release.sh
            chmod 700 /home/wharf/deploy-clean-release.sh
            bash /home/wharf/deploy-clean-release.sh "$commit"
